syntax = "proto3";

package game.core.system;

option go_package = "squad-survival-be/modules/game/core/system;system";

message CharacterSkin {
  int32 hair_id = 1;
  int32 beard_id = 2;
  int32 chest_id = 3;
  int32 eye_id = 4;
  int32 helmet_id = 5;
  int32 weapon_id = 6;
  int32 projectile_id = 7;
}
