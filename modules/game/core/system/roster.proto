syntax = "proto3";

package game.core.system;

option go_package = "squad-survival-be/modules/game/core/system;system";

message PlayerRosterBatch {
  int64 tick = 1;
  repeated PlayerRoster players = 2;
}

message PlayerRoster {
  string user_id = 1;
  string session_id = 2;
  string display_name = 3;
  uint64 roster_version = 4;
  repeated CharacterRoster characters = 5;
}

message CharacterRoster {
  string character_id = 1;
  double health = 2;
  double max_health = 3;
  double damage = 4;
  double move_speed = 5;
  double attack_speed = 6;
  double attack_range = 7;
  double regen_rate = 8;
  string weapon_type = 9;
  string range_class = 10;
  string weapon_id = 11;
  double crit_chance = 12;
  double crit_multiplier = 13;
  double damage_reduction = 14;
  int32 attack_count = 15;
  double cooldown_scale = 16;
  repeated SkillCooldown skill_cooldowns = 17;
}

message SkillCooldown {
  string skill_id = 1;
  string mode = 2;
  double progress = 3;
  double required = 4;
  string active_action_id = 5;
  int64 complete_tick = 6;
}
